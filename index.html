<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>Draw!</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #ffe9b8; }
    body {
      position: fixed; inset: 0; display: grid; gap: 16px; box-sizing: border-box;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      grid-template: 1fr auto / 1fr;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    @media (orientation: landscape) { body { grid-template: 1fr / 1fr auto; } }
    #stage { container-type: size; display: grid; place-items: center; min-width: 0; min-height: 0; }
    #ink {
      width: min(100cqw, 100cqh); height: min(100cqw, 100cqh);
      background: #fff; border-radius: 28px; box-shadow: 0 6px 0 #f4c76b;
    }
    #tools { display: flex; gap: 16px; justify-content: center; align-items: center; }
    @media (orientation: landscape) { #tools { flex-direction: column; } }
    #tools button {
      width: 80px; height: 80px; border: 0; border-radius: 50%; padding: 0;
      background: #fff; box-shadow: 0 5px 0 #f4c76b; touch-action: manipulation;
      display: grid; place-items: center; color: #5a3d1e;
    }
    #tools button:active { transform: translateY(3px); box-shadow: 0 2px 0 #f4c76b; }
    #tools button[aria-pressed="true"] { outline: 6px solid #ff8a3d; outline-offset: 3px; }
    #tools button.swatch { background: var(--c); }
    #tools svg { width: 44px; height: 44px; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="ink"></canvas></div>
  <div id="tools">
    <button id="undo" aria-label="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button id="eraser" aria-label="Eraser" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="m3.5 14.5 9-9a2 2 0 0 1 2.8 0l4.2 4.2a2 2 0 0 1 0 2.8L13 19H8l-4.5-4.5Z" fill="#ffb3c7"/><path d="m8 10 6 6M13 19h7" stroke-linecap="round"/></svg>
    </button>
    <button class="swatch" style="--c:#2b2b2b" data-color="#2b2b2b" aria-label="Black" aria-pressed="true"></button>
    <button class="swatch" style="--c:#e8402a" data-color="#e8402a" aria-label="Red" aria-pressed="false"></button>
    <button class="swatch" style="--c:#2a7de8" data-color="#2a7de8" aria-label="Blue" aria-pressed="false"></button>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
